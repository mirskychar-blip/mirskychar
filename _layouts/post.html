---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
  {% if page.image %}<img class="post-image" src="{{ page.image | relative_url }}" alt="">{% endif %}
  <div class="post-content">
{{ content }}
  </div>
</article>
