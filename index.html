<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a href="index.html"><div class="ph logo"></div></a>   <!-- Site title / logo -->
      <nav>                                                   <!-- Menu links -->
        <a href="index.html"><div class="ph navlink"></div></a>
        <a href="about.html"><div class="ph navlink"></div></a>
        <div class="ph navlink"></div>
        <div class="ph navlink"></div>
        <div class="ph navlink"></div>
      </nav>
    </div>
  </header>
  <div class="wrap layout">
    <main>
      <!-- List of latest posts -->
      <article class="post-item">                <!-- Post preview -->
        <a href="posts/hello-world.html"><div class="ph thumb"></div></a>
        <div>
          <div class="ph subhead" style="width:80%"></div>
          <div class="ph" style="width:25%"></div>
          <div class="ph"></div><div class="ph"></div><div class="ph short"></div>
        </div>
      </article>
      <article class="post-item">                <!-- Post preview -->
        <a href="posts/hello-world.html"><div class="ph thumb"></div></a>
        <div>
          <div class="ph subhead" style="width:80%"></div>
          <div class="ph" style="width:25%"></div>
          <div class="ph"></div><div class="ph"></div><div class="ph short"></div>
        </div>
      </article>
      <article class="post-item">                <!-- Post preview -->
        <a href="posts/hello-world.html"><div class="ph thumb"></div></a>
        <div>
          <div class="ph subhead" style="width:80%"></div>
          <div class="ph" style="width:25%"></div>
          <div class="ph"></div><div class="ph"></div><div class="ph short"></div>
        </div>
      </article>
    </main>
    <aside class="sidebar">
      <div class="widget author">                <!-- Author photo + short bio -->
        <div class="ph photo"></div>
        <div class="ph"></div><div class="ph"></div><div class="ph short" style="margin:0 auto 10px"></div>
      </div>
      <div class="widget">                       <!-- Email sign-up -->
        <div class="ph wtitle"></div>
        <div class="ph"></div>
        <div class="ph input"></div>
        <div class="ph button"></div>
      </div>
      <div class="widget">                       <!-- Popular posts -->
        <div class="ph wtitle"></div>
        <div class="ph"></div><div class="ph short"></div>
        <div class="ph"></div><div class="ph short"></div>
        <div class="ph"></div><div class="ph short"></div>
        <div class="ph"></div><div class="ph short"></div>
      </div>
      <div class="widget">                       <!-- Categories -->
        <div class="ph wtitle"></div>
        <div class="ph short"></div><div class="ph short"></div><div class="ph short"></div>
      </div>
    </aside>
  </div>
  <footer class="site-footer">
    <div class="wrap footer-cols">
      <div>                                      <!-- Column 1: about the blog -->
        <div class="ph wtitle"></div><div class="ph"></div><div class="ph"></div><div class="ph short"></div>
      </div>
      <div>                                      <!-- Column 2: links -->
        <div class="ph wtitle"></div><div class="ph short"></div><div class="ph short"></div><div class="ph short"></div>
      </div>
      <div>                                      <!-- Column 3: social links -->
        <div class="ph wtitle"></div>
        <span class="ph icon"></span><span class="ph icon"></span><span class="ph icon"></span><span class="ph icon"></span>
      </div>
    </div>
    <div class="wrap footer-bottom"><div class="ph" style="width:200px;margin:0"></div></div>  <!-- Copyright -->
  </footer>
</body>
</html>
